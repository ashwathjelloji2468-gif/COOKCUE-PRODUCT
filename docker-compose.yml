services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-messwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-messwise}
      POSTGRES_DB: ${POSTGRES_DB:-messwise}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-messwise} -d ${POSTGRES_DB:-messwise}"]
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-messwise}:${POSTGRES_PASSWORD:-messwise}@db:5432/${POSTGRES_DB:-messwise}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
