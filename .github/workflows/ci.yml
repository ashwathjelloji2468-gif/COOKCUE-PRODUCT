name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: messwise
          POSTGRES_PASSWORD: messwise
          POSTGRES_DB: messwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messwise -d messwise"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://messwise:messwise@localhost:5432/messwise
      SESSION_SECRET: ci_test_environment_session_secret_at_least_32_characters_long
      FOUNDER_NOTIFICATION_EMAIL: cookcue149@gmail.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build
