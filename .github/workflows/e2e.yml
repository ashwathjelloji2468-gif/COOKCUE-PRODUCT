name: Playwright Browser E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-e2e:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: messwise
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d messwise"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5434/messwise
      SESSION_SECRET: ci_test_environment_session_secret_at_least_32_characters_long
      FOUNDER_NOTIFICATION_EMAIL: cookcue149@gmail.com
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Install Playwright Browsers with dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Prisma Database Migrations
        run: npx prisma migrate deploy

      - name: Seed test accounts and initial facilities
        run: npm run db:seed && npm run db:seed-demo

      - name: Build Next.js application
        run: npm run build

      - name: Execute Playwright Browser Journeys
        run: npx playwright test

      - name: Upload Playwright Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
